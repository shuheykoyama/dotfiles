#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "shuheykoyama"
email = "shuheykoyama@gmail.com"

# Sign every commit jj creates or rewrites with the same SSH key git uses. A private key path works
# without an agent. Signatures are not verified locally (no allowed-signers file); GitHub verifies them.
[signing]
backend = "ssh"
behavior = "own"
key = "~/.ssh/id_ed25519_github"

# `jj bookmark advance` moves main to the closest commit that can be pushed instead of the working copy,
# which is empty and has no description. jj refuses to push commits without a description.
[revsets]
bookmark-advance-to = "closest_pushable(@)"

[revset-aliases]
# Closest mutable ancestor of `to` that has a description and is either non-empty or a merge.
"closest_pushable(to)" = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'

# delta for the commands whose output is a plain diff.
[[--scope]]
--when.commands = ["diff", "show", "interdiff"]
[--scope.ui]
pager = "delta"
diff-formatter = ":git"

# `jj log --no-graph -p` goes through delta too. delta cannot parse a diff indented under the graph, so with
# the graph `jj log -p` still prints a git-format diff coloured by jj. Conditions cannot look at flags, so
# the whole command is scoped; delta hands its output to `less -FRXK` like jj's default pager, which keeps a
# plain `jj log` on screen after quitting (delta's own less would clear it).
[[--scope]]
--when.commands = ["log"]
[--scope.ui]
pager = { command = ["delta", "--pager", "less -FRXK"], env = { LESSCHARSET = "utf-8" } }
diff-formatter = ":git"
