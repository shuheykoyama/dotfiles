os:
  shell: fish
  shellArg: -c

git:
  branchPrefix: "shuheykoyama/"
  paging:
    # externalDiffCommand: "difft --color=always"
    colorArg: always
    pager: delta --dark --paging=never
  mainBranches:
    - "main"
    - "master"
    - "develop"
  parseEmoji: true

